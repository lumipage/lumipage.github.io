<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFAF4">
<link rel="icon" href="data:,">
<title>FR-101</title>
<link rel="stylesheet" href="../app.css?v=a9e94e69">
</head>
<body>
<main class="wrap">
  <p class="loading" id="loading" aria-hidden="true"><span></span><span></span><span></span></p>
  <p class="soon" id="soon" data-t="soon" hidden></p>
  <div id="app" hidden>
    <h1 data-t="title"></h1>
    <p class="hint" data-t="start"></p>
    <div class="stage" id="stage">
      <svg id="stage-svg" role="img"></svg>
      <canvas id="pad"></canvas>
      <span class="big" id="big" aria-hidden="true"></span>
    </div>
    <div class="row">
      <button type="button" class="btn nav" id="prev" aria-label="" data-t-aria="prev">‹</button>
      <button type="button" class="btn main" id="replay" data-t="replay"></button>
      <button type="button" class="btn" id="slow" aria-pressed="false" data-t="slow"></button>
      <button type="button" class="btn nav" id="next" aria-label="" data-t-aria="next">›</button>
    </div>
    <button type="button" class="btn wide" id="turn" aria-pressed="false" data-t="yourTurn"></button>
    <button type="button" class="btn wide" id="erase" data-t="erase" hidden></button>
    <h2 data-t="lower"></h2><div class="chips" id="lower"></div>
    <h2 data-t="upper"></h2><div class="chips" id="upper"></div>
    <h2 data-t="digits"></h2><div class="chips" id="digits"></div>
    <p class="parents" data-t="parents"></p>
  </div>
</main>
<script src="../i18n.js?v=a9e94e69"></script>
<script>document.querySelectorAll("[data-t-aria]").forEach(function(b){var T=window.I18N[document.documentElement.lang]||window.I18N.fr;b.setAttribute("aria-label",T[b.getAttribute("data-t-aria")]);});</script>
<script src="../app.js?v=a9e94e69"></script>
</body>
</html>
