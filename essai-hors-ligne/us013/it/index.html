<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E8EDE7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%2214%22 height=%2214%22 rx=%222%22 fill=%22none%22 stroke=%22%235A3E8E%22 stroke-width=%222%22/%3E%3C/svg%3E">
<title>Sudoku del giorno e cronometro</title>
<link rel="preload" href="../fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../data/daily.json" as="fetch" type="application/json" crossorigin>
<link rel="stylesheet" href="../app.css?v=8ffb7830">
</head>
<body>
<main class="wrap">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-sudoku" aria-controls="panel-sudoku" data-t="tabSudoku"></button>
    <button type="button" role="tab" id="tab-timer" aria-controls="panel-timer" data-t="tabTimer"></button>
    <a href="passport/" data-t="tabPassport"></a>
  </div>

  <section id="panel-sudoku" role="tabpanel" aria-labelledby="tab-sudoku">
    <div class="daybar">
      <div class="stamp" aria-live="polite"><span class="lvl" id="s-level"></span><span class="date" id="s-date"></span></div>
      <div class="clock"><span class="t" id="s-time" aria-label="time">0:00</span><button type="button" class="btn" id="s-pause" data-t="pause"></button></div>
    </div>
    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board"></div>
      <div class="veil" data-t="paused"></div>
      <div class="cleared" aria-hidden="true"><div class="big" id="cleared-big"></div><div class="small" id="cleared-small"></div></div>
    </div>
    <div class="pad" id="pad"></div>
    <div class="tools">
      <button type="button" class="btn" id="s-notes" aria-pressed="false" data-t="notes"></button>
      <button type="button" class="btn" id="s-erase" data-t="erase"></button>
      <button type="button" class="btn" id="s-undo" data-t="undo"></button>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <label class="toggle"><input type="checkbox" id="s-mistakes"><span data-t="showMistakes"></span></label>
    <button type="button" class="linkbtn" id="s-restart" data-t="restart"></button>
  </section>

  <section id="panel-timer" role="tabpanel" aria-labelledby="tab-timer" hidden>
    <p class="msg" data-t="timerHelp"></p>
    <div class="timer-face"><div class="t" id="c-time" role="timer">0:00</div></div>
    <div class="row">
      <button type="button" class="btn primary" id="c-go" data-t="start"></button>
      <button type="button" class="btn" id="c-lap" data-t="lap"></button>
      <button type="button" class="btn" id="c-reset" data-t="reset"></button>
    </div>
    <div class="laps">
      <h2 data-t="laps"></h2>
      <p class="msg" id="c-empty" data-t="noLaps"></p>
      <ol id="c-laps"></ol>
      <button type="button" class="linkbtn" id="c-clear" data-t="clearLaps" hidden></button>
    </div>
  </section>

  <p class="foot" data-t="privacy"></p>
</main>

<dialog id="restart-dlg">
  <p data-t="restartConfirm"></p>
  <div class="row">
    <button type="button" class="btn primary" id="restart-yes" data-t="yes"></button>
    <button type="button" class="btn" id="restart-no" data-t="no"></button>
  </div>
</dialog>

<script src="../i18n.js?v=8ffb7830"></script>
<script src="../app.js?v=8ffb7830"></script>
</body>
</html>
